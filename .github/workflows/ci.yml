name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Windows is in the matrix because the project is developed there, and
  # because CLI brains and the installers behave differently on it.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      - name: Tests
        run: bun test

      # A warning until M11, when this gains --strict and starts failing the
      # build on any Spec ID without a test.
      - name: Spec ID coverage
        if: matrix.os == 'ubuntu-latest'
        run: bun run trace

  # The same suite again, this time with a database, so the integration
  # tests run instead of skipping. Linux only: the runner has Docker.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - name: Start the local Supabase stack
        run: bunx supabase start

      - name: Tests
        run: bun test

      - name: Stop the stack
        if: always()
        run: bunx supabase stop

  # REL-2: no secret is ever committed. Runs over the full history.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks dir . --redact --verbose

      - name: Scan the history
        run: gitleaks git . --redact --verbose
